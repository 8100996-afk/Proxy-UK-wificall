<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Proxy Panel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}?v=20261024-2">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('dashboard') }}"><strong>Proxy Panel</strong><span>代理管理</span></a>
    {% if session.authenticated %}
    <nav>
      <a class="{{ 'current' if request.endpoint == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">概览</a>
      <a class="{{ 'current' if request.endpoint == 'socks_page' else '' }}" href="{{ url_for('socks_page') }}">SOCKS5</a>
      <a class="{{ 'current' if request.endpoint == 'subscriptions_page' else '' }}" href="{{ url_for('subscriptions_page') }}">订阅</a>
      <a class="{{ 'current' if request.endpoint == 'secondary_page' else '' }}" href="{{ url_for('secondary_page') }}">二级订阅</a>
      <a class="{{ 'current' if request.endpoint == 'activation_codes_page' else '' }}" href="{{ url_for('activation_codes_page') }}">激活码</a>
      <a class="{{ 'current' if request.endpoint == 'secondary_accounts_page' else '' }}" href="{{ url_for('secondary_accounts_page') }}">二级账号</a>
      <a class="{{ 'current' if request.endpoint == 'wifi_calling_page' else '' }}" href="{{ url_for('wifi_calling_page') }}">Wi‑Fi Call</a>
      <a class="{{ 'current' if request.endpoint == 'settings_page' else '' }}" href="{{ url_for('settings_page') }}">设置</a>
    </nav>
    <div class="dual-clock" id="dual-clock"><span>英国 --:--</span><span>新加坡 --:--</span></div>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="ghost">退出</button></form>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const target = document.getElementById('dual-clock');
      if (!target) return;
      const format = (zone) => new Intl.DateTimeFormat('zh-CN', {timeZone: zone, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZoneName:'short'}).format(new Date());
      const tick = () => target.innerHTML = `<span>英国 ${format('Europe/London')}</span><span>新加坡 ${format('Asia/Singapore')}</span>`;
      tick(); setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
